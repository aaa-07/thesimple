/* V11: reference-led coloured feather shuttle with flight orbit. */
.featherOrbit{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#fff 0%,#f3f4ee 100%);border:1px solid #ffffffb8;box-shadow:0 9px 26px #0008,inset 0 1px 0 #fff;overflow:hidden}
.featherOrbit:after{display:none}.featherOrbit svg{width:42px;height:42px;overflow:visible;filter:none}
.featherOrbit .featherFan{transform-origin:41px 58px;animation:shuttleSettle 6s cubic-bezier(.18,.8,.18,1) infinite}
.featherOrbit .feather{transform-box:fill-box;transform-origin:bottom center;animation:featherOpen 6s cubic-bezier(.18,.84,.2,1) infinite}
.featherOrbit .f1{fill:#8b5fc4}.featherOrbit .f2{fill:#55ae69;animation-delay:.05s}.featherOrbit .f3{fill:#ff677d;animation-delay:.1s}.featherOrbit .f4{fill:#3e7cdd;animation-delay:.15s}.featherOrbit .f5{fill:#f4c51d;animation-delay:.2s}
.featherOrbit .orbitSweep,.featherOrbit .orbitTip{fill:none;stroke:#071009;stroke-linecap:round;stroke-width:5.2}.featherOrbit .orbitSweep{stroke-dasharray:92;stroke-dashoffset:92;animation:orbitDraw 6s cubic-bezier(.16,.78,.18,1) infinite}.featherOrbit .orbitTip{stroke-width:3.3;opacity:0;animation:orbitTip 6s ease-out infinite}
.featherOrbit .collar,.featherOrbit .cork{fill:#071009;stroke:none;transform-origin:41px 63px;animation:corkLand 6s cubic-bezier(.2,.86,.2,1) infinite}.featherOrbit>i{position:absolute;inset:-4px;border:1px solid #ff677d66;border-radius:18px;opacity:0;animation:colourHalo 6s ease-out infinite}

@keyframes featherOpen{0%,11%{transform:scaleX(.18) translateY(8px);opacity:.25}27%{transform:scaleX(1.1);opacity:1}38%,100%{transform:none;opacity:1}}

/* V12: rendered feather mark — no hand-built coloured strips. */
.featherMarkV12{width:48px;height:48px;border-radius:0;background:none;border:0;box-shadow:none;overflow:visible;isolation:isolate}
.featherMarkV12:before{content:"";position:absolute;width:38px;height:12px;left:5px;bottom:1px;border-radius:50%;background:#6ff0b737;filter:blur(8px);opacity:0;animation:markGroundGlow 6.2s ease-out infinite}
.featherMarkV12:after{display:none}.featherMarkV12 img{display:block;width:48px;height:48px;object-fit:contain;position:relative;z-index:2;transform-origin:50% 78%;animation:featherCinematic 6.2s cubic-bezier(.18,.84,.18,1) infinite;filter:drop-shadow(0 7px 9px #0008)}
.featherMarkV12>i{position:absolute;z-index:1;inset:1px;border:1px solid #73efb652;border-radius:50%;opacity:0;animation:markImpactRing 6.2s ease-out infinite}
@keyframes featherCinematic{0%,5%{opacity:0;transform:translate(18px,-18px) rotate(18deg) scale(.52);filter:blur(2px) drop-shadow(0 7px 9px #0000)}18%{opacity:1}28%{transform:translate(-1px,1px) rotate(-1.5deg) scale(1.08);filter:blur(0) drop-shadow(0 7px 9px #0008)}36%{transform:translate(0) rotate(.6deg) scale(.98)}43%,88%{opacity:1;transform:none}94%{opacity:1;transform:translate(-1px,1px) rotate(-2deg) scale(.97)}100%{opacity:0;transform:translate(-14px,12px) rotate(-14deg) scale(.68)}}
@keyframes markImpactRing{0%,23%{opacity:0;transform:scale(.45)}31%{opacity:.8;transform:scale(.9)}49%,100%{opacity:0;transform:scale(1.28)}}
@keyframes markGroundGlow{0%,23%{opacity:0;transform:scaleX(.4)}32%{opacity:.75;transform:scaleX(1)}52%,100%{opacity:0;transform:scaleX(1.25)}}
@media(prefers-reduced-motion:reduce){.featherMarkV12 img,.featherMarkV12>i,.featherMarkV12:before{animation:none!important;opacity:1}}

/* V13: restore reliable touch targets and refine Home below the unchanged hero. */
.studentApp img,
.studentApp svg,
.studentApp button::before,
.studentApp button::after,
.studentApp article::before,
.studentApp article::after,

/* Reference-led visual direction: cinematic depth, strong type and disciplined cards. */
:root{
  --concept-blue:#1476ff;
  --concept-sky:#67b8ff;
  --concept-ink:#03070d;
  --concept-card:#0b111b;
  --concept-line:rgba(255,255,255,.12);
  --concept-text:#f6f9ff;
  --concept-muted:#9aa8b8;
}

html{background:#02050a}
.studentStage{
  background:
    radial-gradient(circle at 50% -8%,#123e7b 0,#071322 26%,#02050a 60%);
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}
.studentApp{
  background:
    radial-gradient(circle at 105% 8%,rgba(20,118,255,.17),transparent 23%),
    linear-gradient(180deg,#050a12,#02050a 35%,#05070b);
  box-shadow:0 0 0 1px rgba(255,255,255,.06),0 40px 120px #000;
}
.studentApp button{font-family:inherit;cursor:pointer}
.studentBar{
  height:88px;
  padding:16px 18px 12px;
  background:linear-gradient(180deg,rgba(3,7,13,.97),rgba(3,7,13,.8),transparent);
  border-bottom:0;
}
.sBrand>div b{font-size:16px;letter-spacing:.16em}
.sBrand>div small{font-size:9px;letter-spacing:.16em;color:#78b9ff}
.studentBar>div button{
  min-width:44px;
  height:44px;
  border-radius:15px;
  border-color:var(--concept-line);
  background:rgba(255,255,255,.07);
  font-size:11px;
}
.studentBar>div button:first-child{background:#f4f7fb;color:#07101c}
.studentView{padding:0 18px 126px;min-height:calc(100vh - 88px)}

/* Home: one cinematic image, then calm editorial groups. */

}
.focusHero>img{object-position:56% 50%;filter:saturate(.95) contrast(1.08)}
.focusHero:after{

    linear-gradient(180deg,rgba(2,7,16,.02) 20%,rgba(2,6,12,.18) 48%,#03070df7 100%),

.focusCopy span{font-size:11px;line-height:1.2;letter-spacing:.16em;color:#b9d9ff}

.focusActions{left:18px;right:18px;bottom:18px;gap:10px}

.homeV2 .homeStatus{gap:12px;margin-top:26px}

/* Concept V2 — spatial, cinematic, badminton-first composition. */

/* Restore the previous animated floating shuttle dock exactly in spirit and motion. */
.shuttleDock{

  padding:7px 8px 6px;
  border-radius:30px;
  background:linear-gradient(115deg,#111713f5,#080b09f2);

  box-shadow:0 20px 60px #000,0 0 0 1px #000;
  overflow:visible;

.shuttleDock:before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(110deg,#ffffff13,transparent 38%);pointer-events:none}

/* Tournament first fold: one lifecycle control, cinematic badminton focus. */
.tournamentRoot .journeyHero{
  height:590px;
  position:relative;
  isolation:isolate;
  overflow:hidden;
  padding:0!important;
  background:#06101e;
}
.tournamentRoot .journeyHero>img{
  position:absolute;
  inset:0;
  z-index:-3;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:54% 50%;
  filter:saturate(1.18) contrast(1.08);
  animation:tournamentHeroBreath 7s cubic-bezier(.4,0,.2,1) infinite;
}
@keyframes tournamentHeroBreath{50%{transform:scale(1.045) translate3d(-4px,-3px,0)}}
.journeyHeroShade{
  position:absolute;
  inset:0;
  z-index:-2;
  background:
    linear-gradient(180deg,#02071222 0%,#03081428 28%,#03070bd9 72%,#030504 100%),
    linear-gradient(90deg,#020611e8 0%,#0206118a 42%,transparent 76%);
}
.journeyHeroFlight{position:absolute;inset:0;z-index:-1;pointer-events:none;mix-blend-mode:screen}
.journeyHeroFlight i{position:absolute;right:-18%;top:46%;width:62%;height:2px;background:linear-gradient(90deg,transparent,#dfff43dd,transparent);filter:blur(.25px);transform:rotate(-14deg);animation:journeyTrace 2.5s ease-in-out infinite}
.journeyHeroFlight i:nth-child(2){top:50%;opacity:.55;animation-delay:-.22s}.journeyHeroFlight i:nth-child(3){top:54%;opacity:.28;animation-delay:-.44s}
@keyframes journeyTrace{0%,100%{opacity:0;transform:translateX(55px) rotate(-14deg) scaleX(.3)}45%{opacity:1}75%{transform:translateX(-75px) rotate(-14deg) scaleX(1.2)}}
.journeyHeroCopy{position:absolute;left:24px;right:24px;top:42px}
.journeyHeroCopy>span{font-size:9px;letter-spacing:.17em;color:#b8d9ff;font-weight:900}
.journeyHeroCopy h1{max-width:360px;margin:17px 0 12px;font-size:47px;line-height:.84;letter-spacing:-.07em;text-shadow:0 14px 34px #000}
.journeyHeroCopy h1 em{font-style:normal;color:var(--sx)}
.journeyHeroCopy p{max-width:300px;margin:0;color:#c0cbd5;font-size:12px;line-height:1.5;text-shadow:0 5px 15px #000}
.journeyNow{
  position:absolute;
  left:24px;
  bottom:126px;
  min-width:200px;
  padding:14px 16px;
  border:1px solid #ffffff24;
  border-radius:18px;
  background:#05100dd1;
  backdrop-filter:blur(18px) saturate(1.35);
  box-shadow:inset 0 1px #ffffff19,0 18px 38px #0008;
}
.journeyNow>span,.journeyNow>b,.journeyNow>small{display:block}
.journeyNow>span{display:flex;align-items:center;gap:7px;color:var(--sx);font-size:8px;letter-spacing:.13em;font-weight:900}
.journeyNow>span i{width:7px;height:7px;border-radius:50%;background:var(--sx);box-shadow:0 0 12px var(--sx)}
.journeyNow>b{margin:8px 0 4px;font-size:14px}
.journeyNow>small{color:#91a09a;font-size:8px}
.journeyStateControl{
  position:absolute;
  left:18px;
  right:18px;
  bottom:18px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  padding:6px;
  border:1px solid #ffffff1c;
  border-radius:24px;
  background:#060b09e8;
  backdrop-filter:blur(22px) saturate(1.35);
  box-shadow:0 18px 44px #000b;
}
.journeyStateControl button{
  min-width:0;
  height:72px;
  padding:7px 3px;
  border:0;
  border-radius:18px;
  background:transparent;
  color:#68766f;
}
.journeyStateControl b,.journeyStateControl span{display:block}
.journeyStateControl b{font-size:18px;line-height:1}
.journeyStateControl span{margin-top:7px;font-size:7px;white-space:nowrap}
.journeyStateControl button.active{background:linear-gradient(145deg,var(--sx),var(--sm));color:#061008;box-shadow:0 9px 23px #62efaf38}
.tournamentRoot .journeySearch{margin-top:16px}
.tournamentRoot .journeyIntro{margin-top:30px}

@media(max-width:370px){
  .tournamentRoot .journeyHero{height:560px}
  .journeyHeroCopy{left:20px;right:20px;top:34px}
  .journeyHeroCopy h1{font-size:41px}
  .journeyNow{left:20px;bottom:119px}
  .journeyStateControl{left:13px;right:13px;bottom:14px}
  .journeyStateControl button{height:68px}
  .journeyStateControl span{font-size:6px}
}

 identity for every competition","Age verification, academy membership, category eligibility, entries, receipts and match calls remain available through the wristband and protected kiosk."],invite:["MATCH INVITE","Accept Friday Flight #14","Confirm availability, select an arrival window and choose singles or doubles. Pairing, group size and court sequence are created after the entry window closes."],clubcup:["INTERNAL TOURNAMENT","Falcons Founders Cup","Academy-only singles, doubles and mixed categories. Entry uses academy level eligibility. Pools lead to Gold, Silver and Plate finals so every student receives meaningful matches."],ladder:["ACADEMY LADDER","A season that keeps moving","Weekly results update a rolling academy ladder. New students enter through placement pools. Absence does not destroy ranking; inactivity slowly reduces protected position."],draft:["TEAM DRAFT NIGHT","Belong to something bigger","Captains draft balanced squads using private level bands\u2014not public skill scores. Teams compete across singles, doubles and mixed ties through a six-week season."],weekly:["WEEKLY MATCH ENGINE","Frequent competition without tournament stress","Students publish availability by wristband or kiosk. AERYX creates pods, court rotations and time windows. Coaches may change the format; the system handles administration."],swap:["COURT WINDOW EXCHANGE","Swap without creating chaos","A player who cannot attend releases the slot. The next eligible player receives it automatically. Draw integrity and partner availability are checked before confirmation."],crew:["PLAYER CREW","Participate even between matches","Volunteer as welcome buddy, court runner, photographer or scoreboard helper. Contributions earn Community Coins and academy recognition without changing competitive ranking."],event:["VERIFIED EVENT DETAIL","Know everything before paying","See category rules, expected reporting window, format, shuttle brand, flooring, organiser history, refund speed, prize se
